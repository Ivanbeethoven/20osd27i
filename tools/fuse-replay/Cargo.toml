[package]
name = "fuse-replay"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Validated, stream-ordered POSIX workload replay against a mounted filesystem"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
