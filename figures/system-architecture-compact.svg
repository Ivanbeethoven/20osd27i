    <text x="81" y="40" font-family="Arial" font-size="8.3" text-anchor="middle" fill="#111111" font-weight="normal">Δᵢ in mutable metadata service</text>
    <text x="10" y="55" font-family="Arial" font-size="8" text-anchor="start" fill="#111111" font-weight="normal">present → private entity</text>
    <text x="10" y="69" font-family="Arial" font-size="8" text-anchor="start" fill="#111111" font-weight="normal">hidden → ENOENT</text>
    <text x="10" y="83" font-family="Arial" font-size="8" text-anchor="start" fill="#111111" font-weight="normal">absent + visible → S</text>
  </g>
  <g id="n:map-heading">
