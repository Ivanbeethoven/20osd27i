    <text x="178" y="11" font-family="Arial" font-size="9" text-anchor="start" fill="#111111" font-weight="bold">(b) Packed snapshot S</text>
    <text x="350" y="11" font-family="Arial" font-size="9" text-anchor="start" fill="#111111" font-weight="bold">(c) Stored layout</text>
    <polyline points="2,18 160,18" fill="none" stroke="#555555" stroke-width="0.6" stroke-linejoin="miter" />
    <polyline points="178,18 332,18" fill="none" stroke="#555555" stroke-width="0.6" stroke-linejoin="miter" />
